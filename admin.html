<style>

}

header{

}

.logo{

h1{

button{

.primary{

.status.success{

}

.status.error{

}

.list{

.item-actions{

}

.action{

  color:var(--pink-deep);

}

.empty{

  font-size:12px;

/* INFO */

.warning{

  }

  }

<div class="card">

<!-- LIST -->

<div class="card">

    id="viewCat"

    <option value="pins/sanrio">

      Pins — Wildcard
    </option>

      Stash

  </div>

</div>


<div class="warning">

  <strong>

  </strong>

  This page has no authentication.
  Keep the admin URL private.

  the Firebase data if your database rules allow public writes.

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  remove,
  onValue,
  off
} from
"https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCPaFBGPyRS0LSdQvNYDucdLbIU2GSfqdE",

  authDomain:
    "greenrobot-ede43.firebaseapp.com",

  databaseURL:
    "https://greenrobot-ede43-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "greenrobot-ede43",

  storageBucket:
    "greenrobot-ede43.appspot.com",

  messagingSenderId:
    "41296246884",

  appId:
    "1:41296246884:web:0a13e2890e4a824cf60771",

  measurementId:
    "G-F3FK6JXBSR"

};


let db;


try{

  const app =
    initializeApp(firebaseConfig);

  db =
    getDatabase(app);

}catch(error){

  console.error(
    "Firebase error:",
    error
  );

}


/* =========================================================
   STATE
========================================================= */

let compressedImage = null;

let editingId = null;

let editingPath = null;

let currentListPath = null;

let currentListListener = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getPathFromForm(){

  const top =
    document.getElementById(
      "topCat"
    ).value;


  if(top === "pins"){

    const sub =
      document.getElementById(
        "subCat"
      ).value;

    return:
      `products/pins/${sub}`;

  }

  return "products/stash";

}


/* =========================================================
   TOGGLE
========================================================= */

window.toggleSub = function(){

  const pins =
    document.getElementById(
      "topCat"
    ).value === "pins";


  document.getElementById(
    "subCatWrap"
  ).style.display =
    pins
      ? "block"
      : "none";

};


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

window.previewImage = function(){

  const input =
    document.getElementById(
      "pImage"
    );

  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    return;

  }


  const reader =
    new FileReader();


  reader.onload = event => {

    const image =
      new Image();


    image.onload = () => {

      const maxSize = 900;

      const scale =
        Math.min(
          1,
          maxSize /
          Math.max(
            image.width,
            image.height
          )
        );


      const width =
        Math.round(
          image.width * scale
        );


      const height =
        Math.round(
          image.height * scale
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      compressedImage =
        canvas.toDataURL(
          "image/jpeg",
          .78
        );


      const preview =
        document.getElementById(
          "preview"
        );

      const wrap =
        document.getElementById(
          "previewWrap"
        );


      preview.src =
        compressedImage;


      wrap.style.display =
        "block";

    };


    image.src =
      event.target.result;

  };


  reader.readAsDataURL(file);

};


/* =========================================================
   STATUS
========================================================= */

function status(
  message,
  type = "info"
){

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;


  element.className =
    "status " + type;

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

window.saveProduct = async function(){

  if(!db){

    status(
      "Firebase isn't connected.",
      "error"
    );

    return;

  }


  const name =
    document.getElementById(
      "pName"
    ).value.trim();


  const price =
    document.getElementById(
      "pPrice"
    ).value.trim();


  const rarity =
    document.getElementById(
      "pRarity"
    ).value;


  if(!name){

    status(
      "Give your find a name first.",
      "error"
    );

    return;

  }


  if(
    price === "" ||
    Number(price) < 0
  ){

    status(
      "Add a valid price.",
      "error"
    );

    return;

  }


  const path =
    getPathFromForm();


  const saveButton =
    document.getElementById(
      "saveBtn"
    );


  saveButton.disabled =
    true;


  status(
    editingId
      ? "Updating your find…"
      : "Adding your find…",
    "info"
  );


  const product = {

    name,

    price,

    rarity,

    image:
      compressedImage || null,

    createdAt:
      editingId
        ? undefined
        : Date.now()

  };


  try{

    /*
      EDIT
    */

    if(editingId){

      const existingRef =
        ref(
          db,
          `${editingPath}/${editingId}`
        );


      /*
        Don't overwrite original
        createdAt if editing.
      */

      if(
        product.createdAt === undefined
      ){

        delete product.createdAt;

      }


      await set(
        existingRef,
        product
      );


      status(
        "Updated ✓",
        "success"
      );

    }

    /*
      NEW
    */

    else{

      await push(
        ref(db,path),
        {
          ...product,
          createdAt:Date.now()
        }
      );


      status(
        "Added ✓",
        "success"
      );

    }


    resetForm();


    if(
      document.getElementById(
        "viewCat"
      ).value ===
      path.replace(
        "products/",
        ""
      )
    ){

      loadList();

    }

  }catch(error){

    console.error(error);

    status(
      "Error: " +
      error.message,
      "error"
    );

  }


  saveButton.disabled =
    false;

};


/* =========================================================
   LOAD LIST
========================================================= */

window.loadList = function(){

  if(!db){
    return;
  }


  const list =
    document.getElementById(
      "list"
    );


  const path =
    "products/" +
    document.getElementById(
      "viewCat"
    ).value;


  list.innerHTML =
    `<div class="empty">
      Loading your finds…
    </div>`;


  if(
    currentListListener &&
    currentListPath
  ){

    off(
      ref(db,currentListPath),
      "value",
      currentListListener
    );

  }


  currentListPath =
    path;


  currentListListener =
    snapshot => {

      const data =
        snapshot.val();


      if(
        !data ||
        typeof data !== "object"
      ){

        list.innerHTML =
          `<div class="empty">
            Nothing here yet 🎀
          </div>`;

        return;

      }


      const items =
        Object.entries(data)
          .map(
            ([id,product]) => ({
              id,
              ...(product || {})
            })
          )
          .sort(
            (a,b) =>
              Number(b.createdAt || 0) -
              Number(a.createdAt || 0)
          );


      list.innerHTML =
        items
          .map(product => {

            const image =
              product.image
                ? `
                  <img
                    class="item-image"
                    src="${escapeHTML(
                      product.image
                    )}"
                    alt="">
                `
                : `
                  <div class="item-image">
                  </div>
                `;


            return `

              <div class="item">

                ${image}

                <div class="item-meta">

                  <div class="item-name">
                    ${escapeHTML(
                      product.name ||
                      "Untitled"
                    )}
                  </div>

                  <div class="item-info">

                    $${escapeHTML(
                      product.price ?? "—"
                    )}

                    ·

                    ${escapeHTML(
                      product.rarity ||
                      "common"
                    )}

                  </div>

                </div>


                <div class="item-actions">

                  <button
                    class="action edit"
                    onclick="
                      editProduct(
                        '${path}',
                        '${product.id}'
                      )
                    ">

                    Edit

                  </button>


                  <button
                    class="action delete"
                    onclick="
                      deleteItem(
                        '${path}',
                        '${product.id}'
                      )
                    ">

                    Delete

                  </button>

                </div>

              </div>

            `;

          })
          .join("");

    };


  onValue(
    ref(db,path),
    currentListListener
  );

};


/* =========================================================
   EDIT
========================================================= */

window.editProduct = async function(
  path,
  id
){

  if(!db){
    return;
  }


  const snapshot =
    await new Promise(
      resolve => {

        onValue(
          ref(
            db,
            `${path}/${id}`
          ),
          snap => {

            resolve(snap);

          },
          {
            onlyOnce:true
          }
        );

      }
    );


  const product =
    snapshot.val();


  if(!product){

    status(
      "This item no longer exists.",
      "error"
    );

    return;

  }


  editingId =
    id;

  editingPath =
    path;


  const relative =
    path.replace(
      "products/",
      ""
    );


  if(
    relative.startsWith(
      "pins/"
    )
  ){

    document.getElementById(
      "topCat"
    ).value =
      "pins";


    document.getElementById(
      "subCat"
    ).value =
      relative.split("/")[1];


    toggleSub();

  }else{

    document.getElementById(
      "topCat"
    ).value =
      "stash";


    toggleSub();

  }


  document.getElementById(
    "pName"
  ).value =
    product.name || "";


  document.getElementById(
    "pPrice"
  ).value =
    product.price ?? "";


  document.getElementById(
    "pRarity"
  ).value =
    product.rarity || "common";


  compressedImage =
    product.image || null;


  if(compressedImage){

    document.getElementById(
      "preview"
    ).src =
      compressedImage;

    document.getElementById(
      "previewWrap"
    ).style.display =
      "block";

  }else{

    document.getElementById(
      "previewWrap"
    ).style.display =
      "none";

  }


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit your find";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Save changes";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "block";


  status(
    "Editing " +
    (product.name || "item"),
    "info"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================================================
   DELETE
========================================================= */

window.deleteItem = async function(
  path,
  id
){

  if(!db){
    return;
  }


  const confirmed =
    confirm(
      "Delete this find forever?"
    );


  if(!confirmed){
    return;
  }


  try{

    await remove(
      ref(
        db,
        `${path}/${id}`
      )
    );


    status(
      "Deleted ✓",
      "success"
    );


  }catch(error){

    console.error(error);

    status(
      "Could not delete: " +
      error.message,
      "error"
    );

  }

};


/* =========================================================
   RESET
========================================================= */

function resetForm(){

  editingId = null;

  editingPath = null;

  compressedImage = null;


  document.getElementById(
    "pName"
  ).value = "";


  document.getElementById(
    "pPrice"
  ).value = "";


  document.getElementById(
    "pImage"
  ).value = "";


  document.getElementById(
    "previewWrap"
  ).style.display =
    "none";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add something cute";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Add to collection";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";

}


window.cancelEdit = function(){

  resetForm();

  status(
    "",
    "info"
  );

};


/* =========================================================
   INITIAL STATE
