/* =========================================================
   RARELY FOUND ADMIN
========================================================= */

:root{

  --pink:#f8c9da;
  --pink-soft:#fff0f5;
  --pink-hot:#ef6595;
  --pink-deep:#d94478;

  --cream:#fffaf6;

  --red:#d93650;

  --green:#4e8b62;

  --ink:#432d35;
  --muted:#8b717a;

  --border:rgba(67,45,53,.11);

  --shadow:
    0 15px 38px rgba(99,48,68,.11);

}


*{

  box-sizing:border-box;

  margin:0;
  padding:0;

}


html{

  background:
    var(--pink-soft);

}


body{

  min-height:100vh;

  padding:
    20px 14px 50px;

  overflow-x:hidden;

  color:
    var(--ink);

  font-family:
    'DM Sans',
    sans-serif;

  background:

    radial-gradient(
      circle at 8% 3%,
      #fff,
      transparent 25%
    ),

    radial-gradient(
      circle at 95% 10%,
      rgba(239,101,149,.15),
      transparent 25%
    ),

    linear-gradient(
      180deg,
      #fdebf2,
      #fffaf7
    );

}


body::before{

  content:"";

  position:fixed;

  inset:0;

  z-index:0;

  pointer-events:none;

  opacity:.3;

  background-image:

    radial-gradient(
      circle,
      rgba(217,68,120,.13) 1px,
      transparent 1px
    );

  background-size:19px 19px;

}


button,
input,
select{

  font:inherit;

}


button{

  cursor:pointer;

}


.container{

  position:relative;

  z-index:2;

  width:
    min(
      640px,
      100%
    );

  margin:auto;

}


/* =========================================================
   FLOATING DECORATIONS
========================================================= */

.decor-layer{

  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  overflow:hidden;

}


.floating{

  position:absolute;

  opacity:0;

  animation:
    floatAround
    var(--duration)
    ease-in-out
    var(--delay)
    infinite;

}


.floating.bow{

  font-size:
    var(--size);

}


.floating.star{

  color:
    var(--pink-hot);

  font-size:
    var(--size);

  filter:
    drop-shadow(
      0 3px 6px
      rgba(217,68,120,.14)
    );

}


@keyframes floatAround{

  0%{

    opacity:0;

    transform:
      translateY(18px)
      rotate(-12deg)
      scale(.65);

  }

  25%{

    opacity:.4;

  }

  50%{

    opacity:.72;

    transform:
      translate(
        var(--move-x),
        calc(var(--move-y) * -1)
      )
      rotate(10deg)
      scale(1);

  }

  80%{

    opacity:.35;

  }

  100%{

    opacity:0;

    transform:
      translate(
        calc(var(--move-x) * -.4),
        -50px
      )
      rotate(25deg)
      scale(.7);

  }

}


/* =========================================================
   HEADER
========================================================= */

header{

  text-align:center;

  margin-bottom:22px;

}


.logo{

  width:100px;
  height:100px;

  object-fit:contain;

  margin-bottom:7px;

  filter:
    drop-shadow(
      0 8px 12px
      rgba(89,45,59,.13)
    );

  animation:
    logoFloat 4s ease-in-out infinite;

}


@keyframes logoFloat{

  0%,100%{

    transform:
      translateY(0)
      rotate(-1deg);

  }

  50%{

    transform:
      translateY(-5px)
      rotate(1deg);

  }

}


h1{

  font-family:
    'Fredoka',
    sans-serif;

  font-size:31px;

  line-height:1;

}


h1 span{

}


.subtitle{

  color:

  font-size:11px;

}


/* =========================================================
   FIREBASE STATUS
========================================================= */

.connection{

  align-items:center;

  gap:7px;

  width:max-content;

  margin:
    12px auto 0;

  padding:

  background:

  color:

  font-weight:800;

  text-transform:uppercase;

}


.connection-dot{

  height:7px;

}


.connection.online{

}


.connection.online

.connection.offline{

}

}


/* =========================================================

========================================================= */

.card{

.status.info{

<script type="module">

/* =========================================================

} from
"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  update,
  remove,
  onValue
} from
"https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCPaFBGPyRS0LSDqvNYDucdLbIU2GSfqdE",

  authDomain:
    "greenrobot-ede43.firebaseapp.com",

  databaseURL:
    "https://greenrobot-ede43-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "greenrobot-ede43",

  storageBucket:
    "greenrobot-ede43.appspot.com",

  messagingSenderId:
    "41296246884",

  appId:
    "1:41296246884:web:0a13e2890e4a824cf60771",

  measurementId:
    "G-F3FK6JXBSR"

};


let db = null;


/* =========================================================
   INIT
========================================================= */

try{

  const app =
    initializeApp(
      firebaseConfig
    );

  db =
    getDatabase(app);

  console.log(
    "🎀 RARELY FOUND ADMIN Firebase connected"
  );

}catch(error){

  console.error(
    "Firebase initialization error:",
    error
  );

  setConnection(
    false,
    "Firebase error"
  );

}


/* =========================================================
   STATE
========================================================= */

let compressedImage =
  null;

let editingId =
  null;

let editingPath =
  null;

let currentListPath =
  null;

let currentListUnsubscribe =
  null;


/* =========================================================
   CONNECTION
========================================================= */

function setConnection(
  online,
  text
){

  const box =
    document.getElementById(
      "connection"
    );

  const label =
    document.getElementById(
      "connectionText"
    );


  if(!box || !label){
    return;
  }


  box.classList.toggle(
    "online",
    online
  );


  box.classList.toggle(
    "offline",
    !online
  );


  label.textContent =
    text;

}


if(db){

  onValue(
    ref(
      db,
      ".info/connected"
    ),

    snapshot => {

      if(
        snapshot.val() === true
      ){

        setConnection(
          true,
          "Firebase connected"
        );

      }else{

        setConnection(
          false,
          "Offline"
        );

      }

    },

    error => {

      console.error(
        "Connection status error:",
        error
      );

      setConnection(
        false,
        "Connection error"
      );

    }

  );

}


/* =========================================================
   HELPERS
========================================================= */

function getPathFromForm(){

  const top =
    document.getElementById(
      "topCat"
    ).value;


  if(top === "pins"){

    const sub =
      document.getElementById(
        "subCat"
      ).value;


    /*
      IMPORTANT:
      Same exact path used by index.html.
    */

    return `products/pins/${sub}`;

  }


  return "products/stash";

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   CATEGORY TOGGLE
========================================================= */

function toggleSub(){

  const pins =
    document.getElementById(
      "topCat"
    ).value === "pins";


  document.getElementById(
    "subCatWrap"
  ).style.display =
    pins
      ? "block"
      : "none";

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function previewImage(){

  const input =
    document.getElementById(
      "pImage"
    );


  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    status(
      "Please choose an image.",
      "error"
    );

    return;

  }


  /*
    Avoid absurdly large files.
  */

  if(
    file.size >
    15 * 1024 * 1024
  ){

    status(
      "Image is too large. Choose one under 15 MB.",
      "error"
    );

    input.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    event => {

      const image =
        new Image();


      image.onload =
        () => {

          const maxSize =
            900;


          const scale =
            Math.min(
              1,
              maxSize /
              Math.max(
                image.width,
                image.height
              )
            );


          const width =
            Math.max(
              1,
              Math.round(
                image.width *
                scale
              )
            );


          const height =
            Math.max(
              1,
              Math.round(
                image.height *
                scale
              )
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          compressedImage =
            canvas.toDataURL(
              "image/jpeg",
              .78
            );


          const preview =
            document.getElementById(
              "preview"
            );


          const wrap =
            document.getElementById(
              "previewWrap"
            );


          preview.src =
            compressedImage;


          wrap.style.display =
            "block";


          status(
            "Photo ready 🎀",
            "info"
          );

        };


      image.onerror =
        () => {

          status(
            "Could not read this image.",
            "error"
          );

        };


      image.src =
        event.target.result;

    };


  reader.onerror =
    () => {

      status(
        "Could not read the file.",
        "error"
      );

    };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   STATUS
========================================================= */

function status(
  message,
  type = "info"
){

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;


  element.className =
    "status " + type;

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(){

  if(!db){

    status(
      "Firebase isn't connected.",
      "error"
    );

    return;

  }


  const name =
    document.getElementById(
      "pName"
    ).value.trim();


  const price =
    document.getElementById(
      "pPrice"
    ).value.trim();


  const rarity =
    document.getElementById(
      "pRarity"
    ).value;


  if(!name){

    status(
      "Give your find a name first.",
      "error"
    );

    return;

  }


  if(
    price === "" ||
    !Number.isFinite(
      Number(price)
    ) ||
    Number(price) < 0
  ){

    status(
      "Add a valid price.",
      "error"
    );

    return;

  }


  const path =
    getPathFromForm();


  const saveButton =
    document.getElementById(
      "saveBtn"
    );


  saveButton.disabled =
    true;


  status(
    editingId
      ? "Updating your find…"
      : "Adding your find…",
    "info"
  );


  try{

    /* =====================================================
       EDIT
    ===================================================== */

    if(editingId){

      const oldPath =
        editingPath;


      const oldId =
        editingId;


      const changes = {

        name,

        price,

        rarity

      };


      /*
        If a new image was selected,
        replace the old one.

        If not, leave existing image untouched.
      */

      if(compressedImage){

        changes.image =
          compressedImage;

      }


      /*
        Same category:
        update existing record.
      */

      if(
        path === oldPath
      ){

        await update(
          ref(
            db,
            `${oldPath}/${oldId}`
          ),
          changes
        );

      }


      /*
        Category changed:
        copy record to new location,
        then delete old record.
      */

      else{

        const existing =
          await readOnce(
            `${oldPath}/${oldId}`
          );


        if(!existing){

          throw new Error(
            "The original item no longer exists."
          );

        }


        const movedProduct = {

          ...existing,

          ...changes

        };


        /*
          Preserve original creation date.
        */

        if(
          !movedProduct.createdAt
        ){

          movedProduct.createdAt =
            Date.now();

        }


        await push(
          ref(
            db,
            path
          ),
          movedProduct
        );


        await remove(
          ref(
            db,
            `${oldPath}/${oldId}`
          )
        );

      }


      status(
        "Updated ✓",
        "success"
      );

    }


    /* =====================================================
       NEW
    ===================================================== */

    else{

      const product = {

        name,

        price,

        rarity,

        image:
          compressedImage || null,

        createdAt:
          Date.now()

      };


      await push(
        ref(
          db,
          path
        ),
        product
      );


      status(
        "Added to RARELY FOUND ✓",
        "success"
      );

    }


    resetForm();


    /*
      Refresh visible admin list.
    */

    loadList();


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    status(
      "Firebase error: " +
      (
        error?.message ||
        "Unknown error"
      ),
      "error"
    );

  }


  saveButton.disabled =
    false;

}


/* =========================================================
   READ ONCE
========================================================= */

async function readOnce(
  path
){

  return new Promise(
    (resolve,reject) => {

      if(!db){

        reject(
          new Error(
            "Firebase is not connected."
          )
        );

        return;

      }


      let finished =
        false;


      onValue(
        ref(
          db,
          path
        ),

        snapshot => {

          if(finished){
            return;
          }


          finished =
            true;


          resolve(
            snapshot.val()
          );

        },

        error => {

          if(finished){
            return;
          }


          finished =
            true;


          reject(
            error
          );

        },

        {
          onlyOnce:true
        }

      );

    }
  );

}


/* =========================================================
   LOAD LIST
========================================================= */

function loadList(){

  if(!db){

    const list =
      document.getElementById(
        "list"
      );


    list.innerHTML =
      `<div class="empty">
        Firebase isn't connected.
      </div>`;

    return;

  }


  const list =
    document.getElementById(
      "list"
    );


  const path =
    "products/" +
    document.getElementById(
      "viewCat"
    ).value;


  list.innerHTML =
    `<div class="empty">
      Loading your finds…
    </div>`;


  /*
    Stop previous subscription.
  */

  if(
    currentListUnsubscribe
  ){

    currentListUnsubscribe();

    currentListUnsubscribe =
      null;

  }


  currentListPath =
    path;


  currentListUnsubscribe =
    onValue(
      ref(
        db,
        path
      ),

      snapshot => {

        renderList(
          snapshot.val()
        );

      },

      error => {

        console.error(
          "LIST ERROR:",
          error
        );


        list.innerHTML =
          `<div class="empty">
            Firebase error:<br>
            ${escapeHTML(
              error.message
            )}
          </div>`;

      }

    );

}


/* =========================================================
   RENDER ADMIN LIST
========================================================= */

function renderList(
  data
){

  const list =
    document.getElementById(
      "list"
    );


  if(
    !data ||
    typeof data !== "object"
  ){

    list.innerHTML =
      `<div class="empty">
        Nothing here yet 🎀
      </div>`;

    return;

  }


  const items =
    Object.entries(data)
      .filter(
        ([,product]) =>
          product &&
          typeof product === "object"
      )
      .map(
        ([id,product]) => ({
          id,
          ...product
        })
      )
      .sort(
        (a,b) =>
          Number(
            b.createdAt || 0
          ) -
          Number(
            a.createdAt || 0
          )
      );


  if(
    items.length === 0
  ){

    list.innerHTML =
      `<div class="empty">
        Nothing here yet 🎀
      </div>`;

    return;

  }


  list.innerHTML =
    "";


  items.forEach(
    product => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      /* IMAGE */

      if(product.image){

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "item-image";


        image.src =
          product.image;


        image.alt =
          "";


        item.appendChild(
          image
        );

      }else{

        const placeholder =
          document.createElement(
            "div"
          );


        placeholder.className =
          "item-image";


        placeholder.textContent =
          "🎀";


        item.appendChild(
          placeholder
        );

      }


      /* META */

      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "item-meta";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "item-name";


      name.textContent =
        product.name ||
        "Untitled";


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "item-info";


      info.textContent =
        `$${product.price ?? "—"} · ${
          product.rarity || "common"
        }`;


      meta.appendChild(
        name
      );

      meta.appendChild(
        info
      );


      /* ACTIONS */

      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "item-actions";


      const edit =
        document.createElement(
          "button"
        );


      edit.type =
        "button";

      edit.className =
        "action edit";

      edit.textContent =
        "Edit";


      edit.addEventListener(
        "click",
        event => {

          tapSparks(
            event
          );


          editProduct(
            currentListPath,
            product.id
          );

        }
      );


      const del =
        document.createElement(
          "button"
        );


      del.type =
        "button";

      del.className =
        "action delete";

      del.textContent =
        "Delete";


      del.addEventListener(
        "click",
        event => {

          tapSparks(
            event
          );


          deleteItem(
            currentListPath,
            product.id
          );

        }
      );


      actions.appendChild(
        edit
      );

      actions.appendChild(
        del
      );


      item.appendChild(
        meta
      );

      item.appendChild(
        actions
      );


      list.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

async function editProduct(
  path,
  id
){

  try{

    const product =
      await readOnce(
        `${path}/${id}`
      );


    if(!product){

      status(
        "This item no longer exists.",
        "error"
      );

      loadList();

      return;

    }


    editingId =
      id;

    editingPath =
      path;


    const relative =
      path.replace(
        "products/",
        ""
      );


    if(
      relative.startsWith(
        "pins/"
      )
    ){

      document.getElementById(
        "topCat"
      ).value =
        "pins";


      document.getElementById(
        "subCat"
      ).value =
        relative.split(
          "/"
        )[1];


      toggleSub();

    }else{

      document.getElementById(
        "topCat"
      ).value =
        "stash";


      toggleSub();

    }


    document.getElementById(
      "pName"
    ).value =
      product.name || "";


    document.getElementById(
      "pPrice"
    ).value =
      product.price ?? "";


    document.getElementById(
      "pRarity"
    ).value =
      product.rarity ||
      "common";


    compressedImage =
      product.image ||
      null;


    const previewWrap =
      document.getElementById(
        "previewWrap"
      );


    if(compressedImage){

      document.getElementById(
        "preview"
      ).src =
        compressedImage;


      previewWrap.style.display =
        "block";

    }else{

      previewWrap.style.display =
        "none";

    }


    /*
      Clear file picker.
      Existing image is kept in compressedImage.
    */

    document.getElementById(
      "pImage"
    ).value =
      "";


    document.getElementById(
      "formTitle"
    ).textContent =
      "Edit your find";


    document.getElementById(
      "saveBtn"
    ).textContent =
      "Save changes";


    document.getElementById(
      "cancelBtn"
    ).style.display =
      "block";


    status(
      "Editing " +
      (
        product.name ||
        "item"
      ),
      "info"
    );


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    console.error(
      "EDIT ERROR:",
      error
    );


    status(
      "Could not load item: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteItem(
  path,
  id
){

  if(!db){

    status(
      "Firebase isn't connected.",
      "error"
    );

    return;

  }


  const confirmed =
    window.confirm(
      "Delete this find forever?"
    );


  if(!confirmed){
    return;
  }


  try{

    await remove(
      ref(
        db,
        `${path}/${id}`
      )
    );


    /*
      If currently editing the deleted item,
      cancel editing.
    */

    if(
      editingId === id &&
      editingPath === path
    ){

      resetForm();

    }


    status(
      "Deleted ✓",
      "success"
    );


  }catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    status(
      "Could not delete: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RESET
========================================================= */

function resetForm(){

  editingId =
    null;

  editingPath =
    null;

  compressedImage =
    null;


  document.getElementById(
    "pName"
  ).value =
    "";


  document.getElementById(
    "pPrice"
  ).value =
    "";


  document.getElementById(
    "pImage"
  ).value =
    "";


  document.getElementById(
    "previewWrap"
  ).style.display =
    "none";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add something cute";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Add to collection";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";

}


/* =========================================================
   EVENTS
========================================================= */

document.getElementById(
  "topCat"
).addEventListener(
  "change",
  toggleSub
);


document.getElementById(
  "pImage"
).addEventListener(
  "change",
  previewImage
);


document.getElementById(
  "saveBtn"
).addEventListener(
  "click",
  event => {

    tapSparks(
      event
    );

    saveProduct();

  }
);


document.getElementById(
  "cancelBtn"
).addEventListener(
  "click",
  event => {

    tapSparks(
      event
    );

    resetForm();

    status(
      "",
      "info"
    );

  }
);


document.getElementById(
  "viewCat"
).addEventListener(
  "change",
  loadList
);


/* =========================================================
   DECORATIONS
========================================================= */

function createDecorations(){

  const layer =
    document.getElementById(
      "decorLayer"
    );


  const symbols = [
    "✦",
    "✧",
    "⋆",
    "♡"
  ];


  for(
    let i=0;
    i<15;
    i++
  ){

    const item =
      document.createElement(
        "span"
      );


    const bow =
      i % 6 === 0;


    item.className =
      "floating " +
      (
        bow
          ? "bow"
          : "star"
      );


    item.textContent =
      bow
        ? "🎀"
        : symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


    item.style.left =
      Math.random()*100 +
      "%";


    item.style.top =
      5 +
      Math.random()*90 +
      "%";


    item.style.setProperty(
      "--size",
      (
        bow
          ? 18 +
            Math.random()*10
          : 10 +
            Math.random()*12
      ) +
      "px"
    );


    item.style.setProperty(
      "--move-x",
      (
        (Math.random()-.5)*60
      ) +
      "px"
    );


    item.style.setProperty(
      "--move-y",
      (
        20 +
        Math.random()*45
      ) +
      "px"
    );


    item.style.setProperty(
      "--duration",
      (
        4 +
        Math.random()*4
      ) +
      "s"
    );


    item.style.setProperty(
      "--delay",
      Math.random()*5 +
      "s"
    );


    layer.appendChild(
      item
    );

  }

}


createDecorations();


/* =========================================================
   INITIAL
========================================================= */

toggleSub();

loadList();

</script>
